syntax = "proto3";

package caapi.v1;
option go_package = "github.com/TWI-Unified-Model/tacra/gen/go/caapi/v1;caapiv1";

enum CredentialAcquisitionMode {
    ACQUISITION_UNSPECIFIED = 0;
    ACQUISITION_ENROLL = 1;
    ACQUISITION_RETRIEVE = 2;
}

// FreshnessKind classifies Evidence freshness for one credential-acquisition
// exchange (draft-novak-rats-tacra). present-* kinds return a Freshness Handle
// that the Attester embeds in Evidence; absent-* kinds return no Handle.
enum FreshnessKind {
    FRESHNESS_KIND_UNSPECIFIED = 0;

    // No Handle; Evidence carries no freshness claim.
    FRESHNESS_KIND_ABSENT_NONE = 1;

    // No Handle; Attester stamps Evidence from a trusted clock (RFC 9334 §10.1).
    FRESHNESS_KIND_ABSENT_TIMESTAMP = 2;

    // No Handle; Attester embeds an epoch identifier already held locally (RFC 9334 §10.3).
    FRESHNESS_KIND_ABSENT_EPOCH = 3;

    // Handle is a single-use nonce the Attester embeds in Evidence (RFC 9334 §10.2).
    FRESHNESS_KIND_PRESENT_NONCE = 4;

    // Handle is the current epoch marker; Attester embeds it and retries
    // Initiate-Credential-Acquisition if the epoch has moved (RFC 9334 §10.3).
    FRESHNESS_KIND_PRESENT_EPOCH = 5;
}

// SigningAlgorithm is the CSK algorithm the Attester must generate for
// Enrollment. Present on InitiateCredentialAcquisitionResponse when mode
// is enroll; echoed on EnrollCredentialRequest. Absent for retrieve.
enum SigningAlgorithm {
    SIGNING_ALGORITHM_UNSPECIFIED = 0;
    SIGNING_ALGORITHM_ECDSA_P256 = 1;
    SIGNING_ALGORITHM_RSA_2048 = 2;
}

// EncryptionAlgorithm is the CEK algorithm the Attester must generate for
// Retrieval. Present on InitiateCredentialAcquisitionResponse when mode
// is retrieve; echoed on RetrieveCredentialRequest. Absent for enroll.
enum EncryptionAlgorithm {
    ENCRYPTION_ALGORITHM_UNSPECIFIED = 0;
    ENCRYPTION_ALGORITHM_ECDH_P256 = 1;
    ENCRYPTION_ALGORITHM_RSA_2048 = 2;
    // The hpke-base container (the Secret Vault seals to it in HPKE base mode with
    // MLKEM768-P256, HKDF-SHA256 and AES-256-GCM, and signs the result): CEKpub is the 1249-octet
    // MLKEM768-P256 encapsulation key itself, not a SubjectPublicKeyInfo.
    ENCRYPTION_ALGORITHM_MLKEM768_P256 = 3;
}

enum CredentialType {
    CREDENTIAL_TYPE_UNSPECIFIED = 0;

    // Bearer token credential types
    CREDENTIAL_TYPE_JWT = 1; // JSON Web Token
    CREDENTIAL_TYPE_PSK = 2; // Pre-shared Key
    CREDENTIAL_TYPE_API_KEY = 3; // API Key

    // Proof-of-possession credential types
    CREDENTIAL_TYPE_X509 = 1001; // PKIX Certificate
    CREDENTIAL_TYPE_WIC  = 1002; // WIMSE Workload Identity Certificate
    CREDENTIAL_TYPE_WIT = 1003; // WIMSE Workload Identity Token
}

message InitiateCredentialAcquistionRequest {
    // Which endpoint does the workload wish to authenticate to?
    string target = 1;

    // Which credential type does the workload with to use?
    CredentialType credential_type = 2;

    // The Credential Hint of Initiate-Credential-Acquisition (TACRA 5.1), optional: a
    // present-nonce second leg must repeat a hint named here (the EST profile, 2 November 2026).
    string credential_hint = 3;
}

message InitiateCredentialAcquisitionResponse {
    // Which credential acquisition mode
    // does the CAS support for this endpoint?
    CredentialAcquisitionMode mode = 1;

    // How freshness is established for this exchange.
    FreshnessKind freshness_kind = 2;

    // Freshness Handle (attestation nonce or epoch marker). Present when
    // freshness_kind is present-nonce or present-epoch.
    optional bytes freshness_handle = 3;

    // CSK algorithm for Enrollment. Present when mode is enroll.
    optional SigningAlgorithm signing_algorithm = 4;

    // CEK algorithm for Retrieval. Present when mode is retrieve.
    optional EncryptionAlgorithm encryption_algorithm = 5;

    // Identifier of the RATS Relying Party that will rely on the Evidence
    // (draft-novak-lamps-tacra-est, rrp_id). The CAI does not bind it: it
    // binds the identifier it holds for the Target and mode (TACRA Section 4.5).
    optional string rrp_id = 6;
}

message EnrollCredentialRequest {
    string target = 1;

    CredentialType credential_type = 2;

    // Optional credential hint
    optional string credential_hint = 3;

    // Workload Evidence including CSKpub
    bytes evidence = 4;

    // CSR for CSKpub
    bytes csr = 5;

    // CSK algorithm from Initiate-Credential-Acquisition.
    optional SigningAlgorithm signing_algorithm = 6;

    // Freshness Kind from Initiate-Credential-Acquisition.
    FreshnessKind freshness_kind = 7;

    // The freshness element the Evidence binds: the Handle (present-*), the
    // local epoch marker (absent-epoch), or eight octets of the Attester's
    // time (absent-timestamp); absent for absent-none. Hardware Evidence does
    // not carry it, so the CAS forwards it (the EST handle field).
    optional bytes freshness_element = 8;

    // Format of evidence, e.g. application/vnd.veraison.tsm-report+cbor.
    optional string evidence_profile = 9;
}

message EnrollCredentialResponse {
    // TODO: explore utilizing existing types (protobuf representation of certificates etc.)
    bytes plaintext_credential = 1;
}

message RetrieveCredentialRequest {
    string target = 1;

    CredentialType credential_type = 2;

    // Optional credential hint
    optional string credential_hint = 3;

    // Workload Evidence including CEKpub
    bytes evidence = 4;

    // CEK algorithm from Initiate-Credential-Acquisition.
    optional EncryptionAlgorithm encryption_algorithm = 5;

    // Freshness Kind from Initiate-Credential-Acquisition.
    FreshnessKind freshness_kind = 6;

    // The freshness element the Evidence binds (as for Enrollment).
    optional bytes freshness_element = 7;

    // Format of evidence.
    optional string evidence_profile = 8;

    // CEKpub as DER SubjectPublicKeyInfo, or, for ENCRYPTION_ALGORITHM_MLKEM768_P256, the
    // encapsulation key itself. Hardware Evidence carries only a digest over it (the binding
    // input), so the Secret Vault needs it here.
    bytes cek_pub = 9;
}

message RetrieveCredentialResponse {
    bytes wrapped_credential = 1;
}

service CredentialAcquisitionService {
    rpc InitiateRemoteAttestation(InitiateCredentialAcquistionRequest) returns (InitiateCredentialAcquisitionResponse);

    rpc EnrollCredential(EnrollCredentialRequest) returns (EnrollCredentialResponse);

    rpc RetrieveCredential(RetrieveCredentialRequest) returns (RetrieveCredentialResponse);
}