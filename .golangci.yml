# golangci-lint configuration for every Go module of the repository. `make lint` runs golangci-lint (the version in
# scripts/versions.env) in each module; CI runs the same target.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  settings:
    errcheck:
      # Closing a response body, a request body or a connection once its data has been read or written. The read or
      # the write has already reported any error that matters; this one leaves nothing to act on.
      exclude-functions:
        - (io.Closer).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*github.com/jackc/pgx/v5.Conn).Close

  exclusions:
    rules:
      # A test's in-process gRPC server: Serve returns when the test stops the server.
      - path: _test\.go
        linters: [errcheck]
        text: "Error return value of `gs.Serve` is not checked"
